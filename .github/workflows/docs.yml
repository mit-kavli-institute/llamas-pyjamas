name: Documentation

# Build the Sphinx documentation and deploy it to GitHub Pages.
# Enable once in the repository: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [documentation]
  workflow_dispatch:

# Allow only one concurrent deployment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build HTML docs
        run: sphinx-build -b html docs docs/_build/html

      # The Pages site root is the designed docs site (docs_site/); the Sphinx
      # API reference is served alongside it under /sphinx/.
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -R docs_site/. _site/
          mkdir -p _site/sphinx
          cp -R docs/_build/html/. _site/sphinx/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
